        px(rx, y + roofH - 5, 2, 4, 'rgba(30, 18, 12, 0.25)');
        px(rx + 2, y + roofH - 4, 2, 2, st.roofHi);
      }
    }

    // Helper: Stardew cross-mullion wooden window + flower/snow sill
    const drawWin = (wx, wy, ww, wh) => {
      px(wx, wy, ww, wh, INK);
      px(wx + 1, wy + 1, ww - 2, wh - 2, winCol);
      px(wx + 1, wy + 1, Math.max(1, Math.floor((ww - 2) / 2)), 2, winHi);
      if (ww >= 7) px(wx + Math.floor(ww / 2), wy + 1, 1, wh - 2, '#5c3318');
      if (wh >= 7) px(wx + 1, wy + Math.floor(wh / 2), ww - 2, 1, '#5c3318');
      px(wx - 1, wy + wh, ww + 2, 1, '#6d4124'); // wooden sill
    };

    // Distinct architectural signature details
    if (b.kind === 'clock') {
      const tw = Math.round(w * 0.46), tx = Math.round(x + (w - tw) / 2);
      px(tx, y - 9, tw, h + 7, INK);
      px(tx + 1, y - 8, tw - 2, h + 5, st.wall);
      for (let py = y + 2; py < y + h - 4; py += 4) px(tx + 1, py, tw - 2, 1, st.wallLo);
      px(tx - 1, y - 10, tw + 2, 4, st.roof);
      px(tx + 2, y - 13, tw - 4, 4, '#f8fbff');
      px(x + w/2 - 1, y - 16, 2, 4, '#fde047');
      px(x + w/2 - 5, y - 3, 10, 10, INK);
      px(x + w/2 - 4, y - 2, 8, 8, lit ? '#fef08a' : '#dce6f2');
      px(x + w/2 - 1, y, 1, 3, '#2d1a12'); px(x + w/2, y + 2, 3, 1, '#2d1a12');
      px(x + w/2 - 4, y + h - 11, 8, 9, '#4a2614');
      px(x + w/2 - 3, y + h - 10, 6, 5, winCol);
    } else if (b.kind === 'ramen') {
      px(x + 6, y + h - 13, w - 12, 10, INK);
      px(x + 7, y + h - 12, w - 14, 8, winCol);
      for (let k = 0; k < 3; k++) px(x + 8 + k * Math.floor((w - 14) / 3), y + h - 13, Math.floor((w - 18) / 3), 5, '#b9261d');
      px(x + w - 7, y + h - 14, 4, 6, lit ? '#ff9f1c' : '#64748b');
      if (lit) px(x + w - 6, y + h - 13, 2, 4, '#fef08a');
    } else if (b.kind === 'bakery' || b.kind === 'cafe') {
      for (let ax = x + 3; ax < x + w - 4; ax += 4) {
        px(ax, y + roofH, 2, 4, st.trim); px(ax + 2, y + roofH, 2, 4, '#fff7ed');
      }
      const ww = Math.max(7, Math.floor(w * 0.28));
      drawWin(x + 5, y + h - 11, ww, 7);
      drawWin(x + w - 5 - ww, y + h - 11, ww, 7);
      px(x + w/2 - 3, y + h - 10, 6, 8, '#5c3318');
      px(x + w/2 - 2, y + h - 9, 4, 3, winCol);
    } else if (b.kind === 'bath') {
      // Tall brick sento chimney + gentle pixel steam puffs!
      px(x + w - 9, y - 8, 6, 14, INK);
      px(x + w - 8, y - 7, 4, 12, '#a84a36');
      px(x + w - 9, y - 8, 6, 2, '#f8fbff');
      const puff = Math.floor(animTime * 2.5) % 3;
      px(x + w - 8 + puff, y - 12 - puff, 3, 2, 'rgba(255,255,255,0.75)');
      px(x + w - 6 - puff, y - 15 - puff, 2, 2, 'rgba(255,255,255,0.5)');
      drawWin(x + 6, y + h - 11, w - 12, 7);
    } else if (b.kind === 'mart') {
      px(x + 2, y + roofH - 1, w - 4, 2, '#f97316');
      px(x + 2, y + roofH + 1, w - 4, 2, '#16a34a');
      px(x + 2, y + roofH + 3, w - 4, 2, '#dc2626');
      px(x + 5, y + h - 10, w - 10, 8, INK);
      px(x + 6, y + h - 9, w - 12, 6, lit ? '#fef9c3' : '#94a3b8');
    } else {
      drawWin(x + 5, y + h - 11, 7, 7);
      drawWin(x + w - 12, y + h - 11, 7, 7);
      px(x + w - 5, y + h - 8, 4, 6, '#c92e2e');
    }
  }

  // Helper: organic rounded pixel fill (trims exposed convex corners so drifts never look like flat squares!)
  function fillOrganicRect(x, y, w, h, cutNW, cutNE, cutSW, cutSE, col) {
    if (w <= 0 || h <= 0) return;
    ctx.fillStyle = col;
    const c = (w >= 14 && h >= 14) ? 2 : 1;
    // Center horizontal band (full width)
    const topTrim = (cutNW || cutNE) ? c : 0;
    const botTrim = (cutSW || cutSE) ? c : 0;
    ctx.fillRect(x, y + topTrim, w, Math.max(0, h - topTrim - botTrim));
    // Top cap
    if (topTrim > 0) {
      const lx = x + (cutNW ? c : 0);
      const rx = x + w - (cutNE ? c : 0);
      if (rx > lx) ctx.fillRect(lx, y, rx - lx, topTrim);
      // 1px intermediate shoulder for soft pixel curve
      if (c >= 2) {
        const lx1 = x + (cutNW ? 1 : 0);
        const rx1 = x + w - (cutNE ? 1 : 0);
        if (rx1 > lx1) ctx.fillRect(lx1, y + 1, rx1 - lx1, 1);
      }
    }
    // Bottom cap
    if (botTrim > 0) {
      const lx = x + (cutSW ? c : 0);
      const rx = x + w - (cutSE ? c : 0);
      if (rx > lx) ctx.fillRect(lx, y + h - botTrim, rx - lx, botTrim);
      if (c >= 2) {
        const lx1 = x + (cutSW ? 1 : 0);
        const rx1 = x + w - (cutSE ? 1 : 0);
        if (rx1 > lx1) ctx.fillRect(lx1, y + h - 2, rx1 - lx1, 1);
      }
    }
  }

  // Handcrafted pixel-art surface motif for each obstacle type (White Snow / Blue Ice / Purple Frost / Brown Slush / Pine Branches / Market Boxes)
  function drawObsPixelTexture(catIdx, rx, ry, rw, rh, seed, sameN, sameS, sameW, sameE) {
    const px = (dx, dy, dw, dh, col) => {
      const ax = Math.round(rx + dx), ay = Math.round(ry + dy);
      const aw = Math.max(1, Math.round(dw)), ah = Math.max(1, Math.round(dh));
      // Keep cleanly within cell bounds
      if (ax + aw <= rx || ax >= rx + rw || ay + ah <= ry || ay >= ry + rh) return;
      ctx.fillStyle = col;
      ctx.fillRect(ax, ay, aw, ah);
    };
    const v = seed % 3;
    const cx = Math.floor(rw * 0.5), cy = Math.floor(rh * 0.5);

    if (catIdx === 0) {
      // 0: 白松雪 — Fluffy pillowy snowdrifts with soft curved ridge arcs, sky-blue shadows & shimmering snow glints
      if (v === 0) {
        // Twin soft snow pillows
        px(3, 4, Math.floor(rw*0.42), 3, '#ffffff');
        px(4, 3, Math.floor(rw*0.32), 2, '#ffffff');
        px(3, 8, Math.floor(rw*0.42), 2, '#cfe0f3');
        px(5, 10, Math.floor(rw*0.3), 1, '#b6cde6');
        px(cx + 1, cy + 1, Math.floor(rw*0.36), 3, '#ffffff');
        px(cx + 2, cy + 4, Math.floor(rw*0.32), 2, '#cfe0f3');
        px(4, rh - 6, 2, 2, '#ffffff');
      } else if (v === 1) {
        // Wind-swept snow wave crescent
        px(3, 5, rw - 7, 2, '#ffffff');
        px(5, 4, rw - 11, 1, '#ffffff');
        px(4, 8, rw - 9, 2, '#d1e2f4');
        px(6, cy + 3, rw - 11, 2, '#ffffff');
        px(8, cy + 5, rw - 14, 1, '#bdd2ea');
        px(rw - 6, 4, 2, 2, '#ffffff');
      } else {
        // Fluffy center dome + specular snow sparkles
        px(cx - 5, cy - 3, 10, 4, '#ffffff');
        px(cx - 3, cy - 5, 6, 2, '#ffffff');
        px(cx - 4, cy + 2, 9, 2, '#c8dbf0');
        px(cx - 2, cy + 4, 6, 1, '#aec7e3');
        px(4, 4, 2, 2, '#ffffff');
        px(rw - 6, rh - 7, 2, 2, '#ffffff');
      }
      // Subtle snow sparkle speck
      if ((seed & 7) === 1) px(cx + 3, 4, 1, 1, '#ffffff');
    } else if (catIdx === 1) {
      // 1: 蓝冻冰 — Translucent faceted glacial ice with 45° glass reflection streaks & angular fracture cracks
      // Diagonal crystalline glass glint (parallel bright white/ice-cyan stair-step)
      for (let i = 0; i < 6; i++) {
        px(4 + i * 2, 4 + i * 2, 2, 2, i % 2 === 0 ? '#f0fcff' : '#bae6fd');
      }
      for (let i = 0; i < 4; i++) {
        px(10 + i * 2, 3 + i * 2, 1, 2, '#e0f7ff');
      }
      // Deep glacial facet plane & crisp angular ice crack
      if (v === 0) {
        px(cx - 2, cy + 1, 2, 4, '#136b9e');
        px(cx, cy + 4, 4, 2, '#136b9e');
        px(cx + 3, cy + 5, 2, 3, '#0e527d');
        px(cx - 1, cy + 1, 1, 3, '#d6f5ff'); // bright rim next to crack
      } else if (v === 1) {
        px(4, cy + 2, 5, 1, '#126496');
        px(8, cy + 3, 3, 2, '#126496');
        px(10, cy + 5, 4, 1, '#0d4e78');
        px(4, cy + 1, 5, 1, '#d8f6ff');
      } else {
        // Faceted ice polygon shimmer
        px(3, rh - 8, rw - 6, 3, '#38b2eb');
        px(cx + 2, 4, 4, 4, '#9ee6ff');
        px(cx + 3, 5, 2, 2, '#ffffff');
        px(5, cy + 2, 2, 5, '#136a9c');
      }
      // Sparkling diamond glint
      px(rw - 6, 4, 2, 2, '#ffffff');
    } else if (catIdx === 2) {
      // 2: 紫深霜 — Jagged amethyst rime-frost crystals & miniature 6-point pixel snowflakes!
      // Deep crystal facet shadows
      px(3, rh - 7, rw - 6, 3, '#7b43cc');
      // Jagged stepped frost crystal clusters
      if (v === 0) {
        // Crisp 5×5 pixel frost-star / snowflake motif
        px(cx - 1, cy - 4, 2, 8, '#f5e6ff');
        px(cx - 4, cy - 1, 8, 2, '#f5e6ff');
        px(cx - 3, cy - 3, 2, 2, '#d8b4fe');
        px(cx + 1, cy - 3, 2, 2, '#d8b4fe');
        px(cx - 3, cy + 1, 2, 2, '#d8b4fe');
        px(cx + 1, cy + 1, 2, 2, '#d8b4fe');
        px(cx - 1, cy - 1, 2, 2, '#ffffff');
        // Spiky crystal shard in corner
        px(3, 5, 2, 4, '#5a28a0'); px(4, 3, 2, 3, '#e9d5ff');
      } else if (v === 1) {
        // Jagged twin crystalline spires poking upward
        px(5, 6, 4, 8, '#6f36bf'); px(6, 3, 2, 5, '#f3e0ff'); px(7, 4, 2, 7, '#c084fc');
        px(cx + 2, 7, 4, 7, '#5e2ca8'); px(cx + 3, 4, 2, 5, '#faf0ff'); px(cx + 4, 6, 2, 6, '#d8b4fe');
        // Small frost star
        px(4, rh - 6, 3, 1, '#f5e8ff'); px(5, rh - 7, 1, 3, '#f5e8ff');
      } else {
        // Diagonal rime-frost needles + mini snowflake
        px(4, 5, 3, 1, '#f3e2ff'); px(5, 4, 1, 3, '#f3e2ff');
        px(rw - 8, cy + 1, 5, 1, '#f5e8ff'); px(rw - 6, cy - 1, 1, 5, '#f5e8ff');
        px(cx - 4, cy + 2, 4, 5, '#6832b5'); px(cx - 3, cy, 2, 4, '#e4c2ff');
        px(cx + 2, 4, 3, 5, '#733bc4'); px(cx + 3, 3, 1, 3, '#ffffff');
      }
      // Subtle spiky frost teeth along top exposed crest
      if (!sameN) {
        px(5, 0, 2, 2, '#f5e6ff');
        px(cx + 2, 0, 2, 2, '#e9d5ff');
      }
    } else if (catIdx === 3) {
      // 3: 棕雪泥 — Textured frozen winter slush & mud mound with lumpy clods, dark pebbles & mixed slush snow flecks
      // Lumpy earthy clods
      px(3, 5, 6, 4, '#ba712c'); px(4, 4, 4, 2, '#e3a659');
      px(cx + 1, cy, 7, 4, '#a65d1e'); px(cx + 2, cy - 1, 4, 2, '#d99548');
      px(4, rh - 7, 6, 3, '#7a4212');
      // Gritty street pebbles & dark wet mud pits
      if (v === 0) {
        px(6, 8, 2, 2, '#4d270a'); px(cx + 4, 5, 2, 2, '#695343');
        px(cx - 2, cy + 4, 3, 2, '#572d0c'); px(rw - 6, rh - 6, 2, 2, '#806d60');
        // Slushy half-melted white snow streaks mixed into mud!
        px(3, 3, 5, 2, '#e3eef7'); px(cx + 1, rh - 5, 4, 2, '#d2e2f0');
      } else if (v === 1) {
        px(5, cy + 1, 3, 2, '#542c0c'); px(cx + 2, 4, 2, 2, '#4d2609');
        px(rw - 7, cy + 3, 2, 2, '#7d695b'); px(4, 4, 2, 2, '#6e5b4e');
        px(cx - 3, 4, 6, 2, '#e8f1fa'); px(3, rh - 6, 4, 1, '#d7e6f2');
      } else {
        px(cx - 1, 6, 3, 2, '#4f280b'); px(4, cy + 3, 2, 2, '#786659');
        px(cx + 4, cy + 2, 3, 2, '#592e0d');
        px(rw - 8, 4, 5, 2, '#e5eff8'); px(5, cy - 1, 4, 2, '#d5e4f2');
      }
    } else if (catIdx === 4) {
      // 4: 断枝堆 — Tangled storm-blown woody branches & spiky emerald pine-needle tufts with snow flecks
      // Dark woody crossed twigs
      for (let i = 0; i < 6; i++) px(4 + i * 2, rh - 6 - i, 3, 2, '#5c3317');
      for (let i = 0; i < 4; i++) px(5 + i * 2, 5 + i * 2, 3, 2, '#7c4823');
      // Layered spiky pine-needle clusters
      px(3, 4, 7, 4, '#245e2d'); px(4, 3, 5, 2, '#5cb85c');
      px(cx, 5, 8, 5, '#1e4f26'); px(cx + 1, 4, 6, 3, '#4aa34e'); px(cx + 2, 4, 4, 1, '#9be06c');
      px(4, cy + 1, 8, 5, '#2b6e35'); px(5, cy + 1, 5, 2, '#70c464');
      px(cx + 1, cy + 3, 7, 4, '#1b4722'); px(cx + 2, cy + 3, 4, 2, '#58b358');
      // Dusted winter snow specks resting on pine needles
      px(5, 3, 3, 1, '#f0f7ff');
      px(cx + 3, cy + 1, 3, 2, '#e8f3ff');
    } else if (catIdx === 5) {
      // 5: 废纸箱 — Crisp miniature pixel festive market cartons/crates tied with twine & snow dusting
      const bx = 3, by = 3, bw = rw - 6, bh = rh - 6;
      // Box shadow & outline
      px(bx - 1, by - 1, bw + 2, bh + 2, '#4a1019');
      // Box lid & front face
      px(bx, by, bw, Math.floor(bh * 0.55), '#e85464');
      px(bx, by + Math.floor(bh * 0.55), bw, bh - Math.floor(bh * 0.55), '#b82538');
      // Lid flap seam
      px(bx, by + Math.floor(bh * 0.55), bw, 1, '#6b1420');
      // Golden parcel ribbon / twine cross
      px(bx + Math.floor(bw/2) - 1, by, 2, bh, '#fde047');
      px(bx, by + Math.floor(bh * 0.35), bw, 2, '#facc15');
      // Cute ribbon bow knot on top
      px(bx + Math.floor(bw/2) - 3, by + 1, 2, 2, '#fef08a');
      px(bx + Math.floor(bw/2) + 1, by + 1, 2, 2, '#fef08a');
      // Light dusting of snow on one corner of the crate
      px(bx + 1, by, 4, 2, '#f5f9ff');
    }
  }

  // Natural snow/frost/mud banking & icicles right against building foundations & walls!
  function drawBuildingSnowIntegration(st, b, ox, oy, ts) {
    const rows = st.def.rows, cols = st.def.cols;
    const px = (rx, ry, rw, rh, col) => {
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(rx), Math.round(ry), Math.max(1, Math.round(rw)), Math.max(1, Math.round(rh)));
    };
    const bx = Math.round(ox + b.c * ts), by = Math.round(oy + b.r * ts);
    const bw = b.w * ts, bh = b.h * ts;

    // 1. Delicate pixel icicles hanging beneath snowed-in eaves (melt away once building warms up & lights up!)
    if (!b.lit && b.kind !== 'fountain' && b.kind !== 'park' && b.kind !== 'shrine') {
      const eaveY = by + Math.floor(bh * 0.38);
      for (let ix = bx + 4; ix < bx + bw - 5; ix += 7) {
        const len = ((ix + b.c * 3) % 2 === 0) ? 4 : 2;
        px(ix, eaveY, 1, len, '#d8f3ff');
        if (len >= 4) px(ix, eaveY, 1, 2, '#ffffff');
      }
    }

    // 2. South doorstep snowdrift banking UP against the building's front base wall!
    const sr = b.r + b.h;
    const isOpenCourtyard = (b.kind === 'park' || b.kind === 'fountain');
    if (sr < rows) {
      for (let dc = 0; dc < b.w; dc++) {
        const c = b.c + dc;
        const cell = st.grid[sr][c];
        if (!cell || cell.type !== 'obs') continue;
        const catIdx = st.def.categories[cell.layers[0]];
        const cat = CATS[catIdx];
        const cx = Math.round(ox + c * ts);
        const wallY = by + bh;
        // Sculpted drift piling softly up onto the building's front wall base (shallower on park/fountain stone curb)
        const h1 = isOpenCourtyard ? 2 : (((c + b.r) % 2 === 0) ? 5 : 3);
        const h2 = isOpenCourtyard ? 2 : (((c + b.r) % 2 === 0) ? 3 : 5);
        px(cx, wallY - h1, Math.floor(ts * 0.56), h1 + 2, cat.fill);
        px(cx + 1, wallY - h1 - 1, Math.floor(ts * 0.46), 2, cat.hi);
        px(cx + Math.floor(ts * 0.44), wallY - h2, Math.ceil(ts * 0.56), h2 + 2, cat.fill);
        px(cx + Math.floor(ts * 0.5), wallY - h2 - 1, Math.floor(ts * 0.42), 2, cat.hi);
        // Soft shaded wall-contact shadow right beneath the snowbank lip
        px(cx, wallY + 1, ts, 1, cat.shade);
        if (!cell.reachable) {
          ctx.fillStyle = THEMES[themeIdx].shadowMask;
          ctx.fillRect(cx, wallY - Math.max(h1, h2) - 1, ts, Math.max(h1, h2) + 3);
        }
      }
    }

    // 3. West & East side-wall wind-blown tapered drifts hugging building flanks!
    const drawSideBank = (edgeX, neighborC, isLeftWall) => {
      if (neighborC < 0 || neighborC >= cols || isOpenCourtyard) return;
      for (let dr = 0; dr < b.h; dr++) {
        const r = b.r + dr;
        const cell = st.grid[r][neighborC];
        if (!cell || cell.type !== 'obs') continue;
        const cat = CATS[st.def.categories[cell.layers[0]]];
        const ry = Math.round(oy + r * ts);
        // Tapered wind-blown snowdrift thicker near building base, tapering up toward roof eave
        const baseW = dr === b.h - 1 ? 4 : 3;
        if (isLeftWall) {
          px(edgeX - 1, ry + 2, baseW, ts - 3, cat.fill);
          px(edgeX, ry + 4, Math.max(1, baseW - 2), ts - 7, cat.hi);
        } else {
          px(edgeX - baseW + 1, ry + 2, baseW, ts - 3, cat.fill);
          px(edgeX - baseW + 2, ry + 4, Math.max(1, baseW - 2), ts - 7, cat.hi);
        }
        if (!cell.reachable) {
          ctx.fillStyle = THEMES[themeIdx].shadowMask;
          ctx.fillRect(isLeftWall ? edgeX - 1 : edgeX - baseW + 1, ry + 2, baseW, ts - 3);
        }
      }
    };
    drawSideBank(bx, b.c - 1, true);
    drawSideBank(bx + bw, b.c + b.w, false);
  }

  function drawDistrictChunk(st, offsetX, isActive) {
    const th = THEMES[themeIdx];
    const ts = tileSize, ox = Math.round(gridOX + offsetX), oy = gridOY;
    const rows = st.def.rows, cols = st.def.cols;
    const gw = cols * ts, gh = rows * ts;

    // Precompute lit lamp positions for warm cobblestone tinting
    const litLamps = [];
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (st.grid[r][c].lamp && st.grid[r][c].lampLit) litLamps.push([r, c]);

    // 1. Stardew-style handcrafted rounded cobblestone street paving (strictly inside [ox, ox + gw])
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = ox + c * ts, y = oy + r * ts;
        const cell = st.grid[r][c];
        let warm = 0;
        for (const [lr, lc] of litLamps) {
          const d = Math.hypot(lr - r, lc - c);
          if (d < 3.6) warm = Math.max(warm, 1 - d / 3.6);
        }
        ctx.fillStyle = ((r + c) % 2 === 0) ? th.roadBase : th.roadAlt;
        ctx.fillRect(x, y, ts, ts);
        if (warm > 0.02) {
          ctx.fillStyle = `rgba(255, 200, 86, ${warm * 0.34})`;
          ctx.fillRect(x, y, ts, ts);
        }
        // Rich Stardew-style staggered rounded stone pavers on cleared street
        if (cell.type === 'empty') {
          const v = (r * 13 + c * 7) % 3;
          ctx.fillStyle = 'rgba(28, 22, 18, 0.14)';
          ctx.fillRect(x, y + Math.floor(ts * 0.5), ts, 1);
          ctx.fillRect(x + Math.floor(ts * ((r % 2 === 0) ? 0.48 : 0.72)), y, 1, Math.floor(ts * 0.5));
          ctx.fillRect(x + Math.floor(ts * ((r % 2 === 0) ? 0.22 : 0.42)), y + Math.floor(ts * 0.5), 1, ts - Math.floor(ts * 0.5));
          // Top-left stone bevel highlight + warm/cool stone variation
          ctx.fillStyle = 'rgba(255, 248, 232, 0.11)';
          ctx.fillRect(x + 2, y + 2, Math.floor(ts * 0.32), 2);
          ctx.fillRect(x + Math.floor(ts * 0.52), y + Math.floor(ts * 0.5) + 2, Math.floor(ts * 0.3), 2);
          if (v === 0) {
            ctx.fillStyle = 'rgba(240, 246, 255, 0.14)';
            ctx.fillRect(x + ts - 4, y + ts - 3, 2, 2); // tiny winter frost speck
          }
          if (cell.revealPop > 0) {
            ctx.fillStyle = `rgba(255, 242, 168, ${cell.revealPop * 0.58})`;
            ctx.fillRect(x + 1, y + 1, ts - 2, ts - 2);
          }
        }
      }
    }

    // 2. Underground brass steam pipes (Valve -> Ice Gates)
    for (const v of st.valves) {
      const vx = Math.round(ox + (v.c + 0.5) * ts), vy = Math.round(oy + (v.r + 0.5) * ts);
      for (const g of v.gates) {
        const gx = Math.round(ox + (g.c + 0.5) * ts), gy = Math.round(oy + (g.r + 0.5) * ts);
        ctx.strokeStyle = v.triggered ? '#fbbf24' : 'rgba(234, 118, 40, 0.45)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(gx, vy); ctx.lineTo(gx, gy); ctx.stroke();
      }
    }

    // 3. Draw Neighbor-Aware Sculpted Micro-Pixel Obstacles (Snow / Ice / Frost / Slush / Branches / Boxes)
    const pulse = 0.5 + 0.5 * Math.sin(animTime * 4.2);
    const getCell = (rr, cc) => (rr >= 0 && rr < rows && cc >= 0 && cc < cols) ? st.grid[rr][cc] : null;
    const isSameTop = (rr, cc, catIdx) => {
      const nb = getCell(rr, cc);
      return !!(nb && nb.type === 'obs' && st.def.categories[nb.layers[0]] === catIdx);
    };
    const isObsCell = (rr, cc) => { const nb = getCell(rr, cc); return !!(nb && nb.type === 'obs'); };
    const isBldgCell = (rr, cc) => { const nb = getCell(rr, cc); return !!(nb && nb.type === 'bldg'); };
    const isOpenCell = (rr, cc) => {
      if (rr >= rows) return true; // South cleared boulevard!
      const nb = getCell(rr, cc);
      return !!(nb && nb.type === 'empty');
    };

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = st.grid[r][c];
        const x = ox + c * ts, y = oy + r * ts;

        if (cell.type === 'gate') {
          // Sculpted crystalline frozen ice barricade gate
          ctx.fillStyle = 'rgba(12, 32, 60, 0.32)';
          ctx.fillRect(x + 2, y + ts - 2, ts - 3, 3);
          fillOrganicRect(x + 1, y + 1, ts - 2, ts - 2, true, true, false, false, '#0c4a6e');
          fillOrganicRect(x + 2, y + 2, ts - 4, ts - 4, true, true, false, false, '#38bdf8');
          ctx.fillStyle = '#e0f7ff'; ctx.fillRect(x + 4, y + 2, ts - 8, 3);
          // Iron/ice vertical lock bars
          ctx.fillStyle = '#075985';
          ctx.fillRect(x + Math.floor(ts * 0.28), y + 3, 2, ts - 6);
          ctx.fillRect(x + Math.floor(ts * 0.66), y + 3, 2, ts - 6);
          ctx.fillStyle = '#bae6fd';
          ctx.fillRect(x + Math.floor(ts * 0.28) + 2, y + 4, 1, ts - 8);
          ctx.fillRect(x + Math.floor(ts * 0.66) + 2, y + 4, 1, ts - 8);
          continue;
        }
        if (cell.valveId && cell.type === 'empty') {
          drawPixelValve(x + ts/2, y + ts/2, ts * 0.4, true);
        }
        if (cell.type !== 'obs') continue;

        const catIdx = st.def.categories[cell.layers[0]];
        const topCat = CATS[catIdx];
        const isDouble = cell.layers.length >= 2;
        const botCatIdx = isDouble ? st.def.categories[cell.layers[1]] : -1;
        const botCat = isDouble ? CATS[botCatIdx] : null;
        const isHetero = isDouble && botCatIdx !== catIdx;
        const seed = ((r * 73 + c * 37 + st.def.id * 19) >>> 0);

        const sameN = isSameTop(r - 1, c, catIdx);
        const sameS = isSameTop(r + 1, c, catIdx);
        const sameW = isSameTop(r, c - 1, catIdx);
        const sameE = isSameTop(r, c + 1, catIdx);
        const obsN = isObsCell(r - 1, c);
        const obsS = isObsCell(r + 1, c);
        const obsW = isObsCell(r, c - 1);
        const obsE = isObsCell(r, c + 1);
        const bldgN = isBldgCell(r - 1, c);
        const bldgS = isBldgCell(r + 1, c);
        const bldgW = isBldgCell(r, c - 1);
        const bldgE = isBldgCell(r, c + 1);
        const openN = isOpenCell(r - 1, c);
        const openS = isOpenCell(r + 1, c);
        const openW = isOpenCell(r, c - 1);
        const openE = isOpenCell(r, c + 1);

        // Flush seamlessly against neighboring obstacles & building walls (zero awkward 1px cobblestone cracks!);
        // inset 1px ONLY along exposed edges facing open cleared street!
        const rx = x + ((obsW || bldgW) ? 0 : 1);
        const ry = y + ((obsN || bldgN) ? 0 : 1);
        const rx1 = x + ts - ((obsE || bldgE) ? 0 : 1);
        const ry1 = y + ts - ((obsS || bldgS) ? 0 : 1);
        const rw = rx1 - rx, rh = ry1 - ry;

        // Round off convex corners facing open road so drifts curve organically onto cobblestones!
        const cutNW = !obsN && !obsW && !bldgN && !bldgW;
        const cutNE = !obsN && !obsE && !bldgN && !bldgE;
        const cutSW = !obsS && !obsW && !bldgS && !bldgW;
        const cutSE = !obsS && !obsE && !bldgS && !bldgE;

        // Ground contact shadow on exposed street below
        if (!obsS && !bldgS) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.28)';
          ctx.fillRect(rx + (cutSW ? 2 : 0), ry1 - 1, rw - (cutSW ? 2 : 0) - (cutSE ? 2 : 0), 3);
        }

        if (isHetero) {
          // Heterogeneous double-layer (e.g. Snow over Ice / Mud / Branches / Boxes):
          // Draw real bottom material peeking out along lower skirt + draped top snowdrift overhanging above!
          fillOrganicRect(rx, ry, rw, rh, cutNW, cutNE, cutSW, cutSE, botCat.fill);
          drawObsPixelTexture(botCatIdx, rx, ry, rw, rh, seed + 5, sameN, sameS, sameW, sameE);
          if (!sameS && !bldgS) {
            ctx.fillStyle = botCat.shade;
            ctx.fillRect(rx + (cutSW ? 2 : 0), ry1 - 3, rw - (cutSW ? 2 : 0) - (cutSE ? 2 : 0), 2);
          }
          // Draped top snowdrift blanket covering upper ~66% with scalloped overhang edge!
          const drapeH = Math.floor(rh * 0.66);
          fillOrganicRect(rx, ry, rw, drapeH, cutNW, cutNE, false, false, topCat.fill);
          ctx.fillStyle = topCat.fill;
          ctx.fillRect(rx + 2, ry + drapeH, Math.floor(rw * 0.36), 3);
          ctx.fillRect(rx + Math.floor(rw * 0.56), ry + drapeH, Math.floor(rw * 0.32), 2);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.28)';
          ctx.fillRect(rx + 1, ry + drapeH + 2, Math.floor(rw * 0.4), 1);
          ctx.fillRect(rx + Math.floor(rw * 0.54), ry + drapeH + 1, Math.floor(rw * 0.36), 1);
          drawObsPixelTexture(catIdx, rx, ry, rw, drapeH, seed, sameN, true, sameW, sameE);
        } else {
          // Single-layer or Same-Color x2: sculpted organic body + handcrafted pixel material texture
          fillOrganicRect(rx, ry, rw, rh, cutNW, cutNE, cutSW, cutSE, topCat.fill);
          drawObsPixelTexture(catIdx, rx, ry, rw, rh, seed, sameN, sameS, sameW, sameE);

          // 3D front snowbank / ice-shelf / mud-ridge thickness lip on exposed south face (or softer lip where different material meets south)
          if (!sameS && !bldgS) {
            const lx = rx + (cutSW ? 2 : 0), lw = rw - (cutSW ? 2 : 0) - (cutSE ? 2 : 0);
            ctx.fillStyle = topCat.shade;
            ctx.fillRect(lx, ry1 - 3, lw, 2);
            ctx.fillStyle = obsS ? topCat.shade : topCat.ink;
            ctx.fillRect(lx, ry1 - 1, lw, 1);
            // Organic scalloped overhang tufts when banking into another material south!
            if (obsS) {
              ctx.fillStyle = topCat.fill;
              ctx.fillRect(rx + 3 + (seed % 4), ry1 - 1, 5, 2);
              ctx.fillRect(rx + Math.floor(rw * 0.55), ry1 - 1, 4, 2);
            }
          }
          // Bright sculpted crest highlight on exposed north face
          if (!sameN && !bldgN) {
            const lx = rx + (cutNW ? 2 : 0), lw = rw - (cutNW ? 2 : 0) - (cutNE ? 2 : 0);
            ctx.fillStyle = topCat.hi;
            ctx.fillRect(lx, ry, lw, 2);
          }
          // Crisp pixel edge ONLY on open-road flanks; subtle organic interlocking seam between different materials!
          if (!sameW && !bldgW) {
            ctx.fillStyle = obsW ? topCat.shade : topCat.ink;
            ctx.fillRect(rx, ry + (cutNW ? 2 : 0), 1, rh - (cutNW ? 2 : 0) - (cutSW ? 2 : 0));
          }
          if (!sameE && !bldgE) {
            ctx.fillStyle = obsE ? topCat.shade : topCat.ink;
            ctx.fillRect(rx1 - 1, ry + (cutNE ? 2 : 0), 1, rh - (cutNE ? 2 : 0) - (cutSE ? 2 : 0));
          }
        }

        // Same-color x2 thick stacked upper tier mound + crisp tiny corner pip for instant readability
        if (isDouble && !isHetero) {
          const tx = rx + 3, ty = ry + 1, tw = rw - 6, th2 = Math.floor(rh * 0.56);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.30)';
          ctx.fillRect(tx, ty + th2, tw, 2);
          fillOrganicRect(tx, ty, tw, th2, true, true, true, true, topCat.fill);
          ctx.fillStyle = topCat.hi;
          ctx.fillRect(tx + 2, ty, Math.max(2, tw - 4), 2);
          ctx.fillStyle = topCat.shade;
          ctx.fillRect(tx + 1, ty + th2 - 2, Math.max(2, tw - 2), 1);
        }

        // Crisp mini double-layer corner gem (gold for x2 same-color, bottom-color for hetero A-over-B)
        if (isDouble) {
          ctx.fillStyle = '#241712';
          ctx.fillRect(x + ts - 7, y + 2, 5, 5);
          ctx.fillStyle = isHetero ? botCat.fill : '#fde047';
          ctx.fillRect(x + ts - 6, y + 3, 3, 3);
        }

        if (cell.valveId) drawPixelValve(x + ts/2, y + ts/2, ts * 0.36, false);

        // Refined Reachability Signifier: soft dusk veil on locked interior; crisp warm edge shimmer ONLY on exposed road-facing front!
        if (!cell.reachable) {
          fillOrganicRect(rx, ry, rw, rh, cutNW, cutNE, cutSW, cutSE, th.shadowMask);
        } else {
          const edgeGlow = `rgba(255, 250, 200, ${(0.45 + pulse * 0.45).toFixed(2)})`;
          ctx.fillStyle = edgeGlow;
          if (openS) ctx.fillRect(rx + (cutSW ? 2 : 0), ry1 - 2, rw - (cutSW ? 2 : 0) - (cutSE ? 2 : 0), 2);
          if (openN) ctx.fillRect(rx + (cutNW ? 2 : 0), ry, rw - (cutNW ? 2 : 0) - (cutNE ? 2 : 0), 2);
          if (openW) ctx.fillRect(rx, ry + (cutNW ? 2 : 0), 2, rh - (cutNW ? 2 : 0) - (cutSW ? 2 : 0));
          if (openE) ctx.fillRect(rx1 - 2, ry + (cutNE ? 2 : 0), 2, rh - (cutNE ? 2 : 0) - (cutSE ? 2 : 0));
        }
      }
    }

    // 4. Draw Varied Embedded Micro-Pixel Buildings + Ground Shadows + Natural Snow Banking Against Walls!
    for (const b of st.buildings) {
      const bx = Math.round(ox + b.c * ts), by = Math.round(oy + b.r * ts);
      const bw = b.w * ts, bh = b.h * ts;
      // Soft grounded drop shadow on cobblestone south & east of building
      ctx.fillStyle = 'rgba(15, 23, 42, 0.24)';
      ctx.fillRect(bx + 2, by + bh, bw, 3);
      ctx.fillRect(bx + bw, by + 3, 2, bh);
      drawPixelBuilding(b, ox, oy, ts);
      drawBuildingSnowIntegration(st, b, ox, oy, ts);
    }

    // 5. Micro-Pixel Strolling Townsfolk
    for (const res of st.residents) {
      const rx = Math.round(ox + (res.x + 0.5) * ts), ry = Math.round(oy + (res.y + 0.68) * ts);
      const bob = Math.round(Math.abs(Math.sin(res.phase)) * 1.5);
      ctx.fillStyle = '#1e1b18'; ctx.fillRect(rx - 3, ry - 9 - bob, 6, 9);
      ctx.fillStyle = res.coat; ctx.fillRect(rx - 2, ry - 5 - bob, 4, 4);
      ctx.fillStyle = res.scarf; ctx.fillRect(rx - 2, ry - 6 - bob, 4, 2);
      ctx.fillStyle = '#fde2c4'; ctx.fillRect(rx - 2, ry - 9 - bob, 4, 3);
    }

    // 6. Dispatched 4-Direction Crisp Pixel Vehicles (ONLY when player tapped cards!)
    const sorted = [...st.units].sort((a, b) => a.y - b.y);
    for (const u of sorted) {
      const ux = Math.round(ox + (u.x + 0.5) * ts), uy = Math.round(oy + (u.y + 0.5) * ts);
      // Warm night headlight cone
      ctx.save();
      const hl = ctx.createRadialGradient(ux, uy, 2, ux, uy, ts * 1.25);
      hl.addColorStop(0, u.isBeast ? 'rgba(255, 224, 110, 0.55)' : 'rgba(255, 240, 170, 0.36)');
      hl.addColorStop(1, 'rgba(255, 230, 140, 0)');
      ctx.fillStyle = hl; ctx.fillRect(ux - ts*1.3, uy - ts*1.3, ts*2.6, ts*2.6);

      const dw = Math.round(ts * (u.isBeast ? 1.25 : 1.08));
      if (u.dir === 'up' || u.dir === 'down') {
        const spr = createVertTruckCanvas(u.catId, u.dir, u.isBeast, u.isWildcard);
        ctx.drawImage(spr, Math.round(ux - dw*0.44), Math.round(uy - dw*0.52), Math.round(dw*0.88), Math.round(dw*1.04));
      } else {
        const spr = createSideTruckCanvas(u.catId, u.isBeast, u.isWildcard);
        ctx.translate(ux, uy);
        if (u.dir === 'left') ctx.scale(-1, 1);
        ctx.drawImage(spr, Math.round(-dw*0.55), Math.round(-dw*0.44), Math.round(dw*1.1), Math.round(dw*0.86));
      }
      ctx.restore();
    }

    // 7. Crisp Pixel Streetlamps
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = st.grid[r][c];
        if (!cell.lamp) continue;
        const lx = Math.round(ox + (c + 0.86) * ts), ly = Math.round(oy + (r + 0.85) * ts);
        const h = Math.round(ts * 1.15);
        if (cell.lampLit) {
          const g = ctx.createRadialGradient(lx, ly - h, 1, lx, ly - h, ts * 1.85);
          g.addColorStop(0, th.lampHalo); g.addColorStop(1, 'rgba(255,200,80,0)');
          ctx.fillStyle = g; ctx.fillRect(lx - ts*2, ly - h - ts*2, ts*4, ts*4);
        }
        ctx.fillStyle = '#241712'; ctx.fillRect(lx - 1, ly - h, 2, h);
        ctx.fillStyle = cell.lampLit ? '#fef08a' : '#475569';
        ctx.fillRect(lx - 2, ly - h - 3, 4, 4);
      }
    }

    // 8. Aim Reticle & Fireballs (active district only)
    if (isActive && st.aimMode && hoverTile) {
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = hoverTile.r + dr, nc = hoverTile.c + dc;
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
        ctx.fillStyle = 'rgba(239, 68, 68, 0.36)';
        ctx.fillRect(ox + nc * ts, oy + nr * ts, ts, ts);
        ctx.strokeStyle = '#fde047'; ctx.lineWidth = 1.5;
        ctx.strokeRect(ox + nc * ts + 0.5, oy + nr * ts + 0.5, ts - 1, ts - 1);
      }
    }
    for (const fb of st.fireballs) {
      ctx.fillStyle = '#f97316'; ctx.fillRect(fb.x - 5, fb.y - 5, 10, 10);
      ctx.fillStyle = '#fef08a'; ctx.fillRect(fb.x - 3, fb.y - 3, 6, 6);
    }

    // 9. Crisp Pixel Particles & Float Labels
    for (const p of st.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x + offsetX), Math.round(p.y), p.sz, p.sz);
    }
    ctx.globalAlpha = 1;
    for (const f of st.floats) {
      ctx.globalAlpha = Math.min(1, f.life / (f.maxLife * 0.4));
      ctx.font = '900 11px sans-serif'; ctx.textAlign = 'center';
      ctx.strokeStyle = '#24140c'; ctx.lineWidth = 3;
      ctx.strokeText(f.text, f.x + offsetX, f.y);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x + offsetX, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawPixelValve(cx, cy, r, open) {
    const x = Math.round(cx), y = Math.round(cy), s = Math.max(4, Math.round(r));
    ctx.fillStyle = '#24140c'; ctx.fillRect(x - s - 1, y - s - 1, s*2 + 2, s*2 + 2);
    ctx.fillStyle = open ? '#fbbf24' : '#dc2626'; ctx.fillRect(x - s, y - s, s*2, s*2);
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(x - s + 1, y - 1, s*2 - 2, 2);
    ctx.fillRect(x - 1, y - s + 1, 2, s*2 - 2);
  }

  function render() {
    ctx.clearRect(0, 0, viewW, viewH);
    const st = curState(); if (!st) return;
    const th = THEMES[themeIdx];
    const rows = st.def.rows, cols = st.def.cols;
    const ts = tileSize, gw = cols * ts, gh = rows * ts;

    ctx.save();
    if (st.trauma > 0) {
      const s = st.trauma * st.trauma * 6;
      ctx.translate(Math.round(Math.sin(st.shakeT*1.7)*s), Math.round(Math.sin(st.shakeT*2.3)*s));
    }

    // 0. Unified continuous city-scroll backdrop (zero blank seams between districts!)
    ctx.fillStyle = th.snowBg;
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.fillStyle = th.sky;
    ctx.fillRect(0, 0, viewW, Math.max(4, gridOY - 1));

    // Natural cobblestone street continuation past leftmost & rightmost scroll boundaries
    const firstLeft = Math.round(gridOX - camX * distStrideW);
    const lastRight = Math.round(gridOX + (districtStates.length - camX) * distStrideW);
    const drawSideStreet = (sx, sw) => {
      if (sw <= 0) return;
      for (let r = 0; r < rows; r++) {
        ctx.fillStyle = (r % 2 === 0) ? th.roadBase : th.roadAlt;
        ctx.fillRect(sx, gridOY + r * ts, sw, ts);
        // Snowy sidewalk snowbank texture along outer avenue edge
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.fillRect(sx, gridOY + r * ts + 2, sw, Math.max(2, ts - 4));
      }
    };
    if (firstLeft > 0) drawSideStreet(0, firstLeft);
    if (lastRight < viewW) drawSideStreet(lastRight, viewW - lastRight);

    // Continuous unbroken south cobblestone boulevard + gliding dashed lane line
    ctx.fillStyle = th.curb;
    ctx.fillRect(0, gridOY + gh, viewW, 14);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
    ctx.fillRect(0, gridOY + gh, viewW, 1);
    ctx.fillStyle = 'rgba(255, 232, 168, 0.5)';
    const dashStep = 12;
    const dashOff = ((-Math.round(camX * distStrideW) % dashStep) + dashStep) % dashStep;
    for (let dx = dashOff - dashStep; dx < viewW; dx += dashStep) {
      ctx.fillRect(dx, gridOY + gh + 6, 6, 2);
    }

    // 1. Chunked Horizontal Viewport Culling (edge-to-edge zero-gap city blocks!)
    for (let i = 0; i < districtStates.length; i++) {
      const offsetX = (i - camX) * distStrideW;
      if (offsetX + distStrideW < -viewW * 0.25 || offsetX > viewW * 1.25) continue;
      drawDistrictChunk(districtStates[i], offsetX, i === activeIdx);
    }

    // 2. Natural stone-curb & crosswalk transition seam between adjacent districts
    for (let i = 0; i < districtStates.length - 1; i++) {
      const seamX = Math.round(gridOX + (i + 1 - camX) * distStrideW);
      if (seamX < -16 || seamX > viewW + 16) continue;
      // Subtle recessed stone avenue seam
      ctx.fillStyle = 'rgba(30, 41, 59, 0.22)';
      ctx.fillRect(seamX - 1, gridOY, 2, gh);
      // Crisp mini crosswalk stripes along the south avenue intersection
      ctx.fillStyle = 'rgba(255, 248, 224, 0.58)';
      for (let sy = gridOY + gh + 2; sy < gridOY + gh + 13; sy += 3) {
        ctx.fillRect(seamX - 4, sy, 8, 2);
      }
      // Subtle stone pavement marker ticks along the block seam
      ctx.fillStyle = 'rgba(255, 255, 255, 0.26)';
      for (let r = 0; r < rows; r++) {
        ctx.fillRect(seamX - 1, gridOY + r * ts + Math.floor(ts * 0.35), 2, Math.max(3, Math.floor(ts * 0.3)));
      }
    }

    // Gentle side framing veil on neighboring peek margins while settled on active district
    const glideAlpha = Math.max(0, 1 - Math.abs(camX - activeIdx) * 6);
    if (glideAlpha > 0.01 && gridOX > 0) {
      ctx.fillStyle = `rgba(15, 23, 42, ${(0.14 * glideAlpha).toFixed(3)})`;
      ctx.fillRect(0, gridOY, gridOX, gh);
      const rightStart = gridOX + gw;
      if (rightStart < viewW) ctx.fillRect(rightStart, gridOY, viewW - rightStart, gh);
    }

    // 3. Crisp 1-2px ambient pixel snow
    ctx.fillStyle = th.snowFlake;
    for (const f of flakes) ctx.fillRect(Math.round(f.x * viewW), Math.round(f.y * viewH), f.r, f.r);

    // 4. Golden warm sprint frame glow
    if (st.sprintActive && st.status === 'playing') {
      ctx.strokeStyle = `rgba(253, 224, 71, ${0.4 + 0.3 * Math.sin(animTime * 6)})`;
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, viewW - 4, viewH - 4);
    }
    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* =========================================================
     13. INPUT & EVENT WIRING (Scroll strictly locked during play)
  ========================================================= */
  function evtToTile(ev) {
    const rect = canvas.getBoundingClientRect();
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
    const c = Math.floor((cx - rect.left - gridOX) / tileSize);
    const r = Math.floor((cy - rect.top - gridOY) / tileSize);
    const st = curState();
    if (r >= 0 && r < st.def.rows && c >= 0 && c < st.def.cols) return { r, c };
    return null;
  }

  canvas.addEventListener('pointerdown', ev => {
    if (curState().aimMode) {
      const t = evtToTile(ev);
      if (t) dropFlame(t.r, t.c); else toggleAim(false);
    }
  });
  canvas.addEventListener('pointermove', ev => {
    hoverTile = curState().aimMode ? evtToTile(ev) : null;
  });
  canvas.addEventListener('pointerleave', () => { hoverTile = null; });

  document.getElementById('btn-theme').addEventListener('click', () => {
    themeIdx = (themeIdx + 1) % THEMES.length;
    const shell = document.getElementById('app-shell');
    shell.className = THEMES[themeIdx].css;
    document.getElementById('btn-theme').textContent = THEMES[themeIdx].label;
  });
  document.getElementById('btn-sound').addEventListener('click', () => {
    sfx.muted = !sfx.muted; document.getElementById('btn-sound').textContent = sfx.muted ? '🔇' : '🔊';
  });
  document.getElementById('btn-restart').addEventListener('click', restartCurrentDistrict);
  document.getElementById('aim-cancel').addEventListener('click', () => toggleAim(false));
  document.getElementById('sprint-btn').addEventListener('click', () => {
    const st = curState(); st.autoSweeping = true; st.autoCd = 0;
    document.getElementById('sprint-btn').classList.remove('show');
  });

  document.getElementById('prop-wildcard').addEventListener('click', useWildcard);
  document.getElementById('prop-expand').addEventListener('click', useExpand);
  document.getElementById('prop-shuffle').addEventListener('click', useShuffle);
  document.getElementById('prop-flame').addEventListener('click', () => toggleAim());

  document.getElementById('res-ex').addEventListener('click', useExpand);
  document.getElementById('res-wc').addEventListener('click', useWildcard);
  document.getElementById('res-fl').addEventListener('click', () => toggleAim(true));
  document.getElementById('res-sh').addEventListener('click', useShuffle);
  document.getElementById('res-re').addEventListener('click', restartCurrentDistrict);

  document.getElementById('win-re').addEventListener('click', restartCurrentDistrict);
  document.getElementById('win-next').addEventListener('click', () => selectDistrict((activeIdx + 1) % DISTRICTS.length, false));

  window.addEventListener('resize', resizeCanvas);

  initAllDistricts();
  resizeCanvas();
  requestAnimationFrame(loop);
})();
</script>
</body>
