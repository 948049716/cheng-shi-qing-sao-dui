  /* =========================================================
     12. STARDEW 16-BIT ORTHOGONAL CITY RENDERER (1:1 Design Art Faithful!)
  ========================================================= */
  function resizeCanvas() {
    const rect = document.getElementById('zone-battle').getBoundingClientRect();
    viewW = Math.max(260, Math.floor(rect.width));
    viewH = Math.max(260, Math.floor(rect.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;

    const cols = 17, rows = 13;
    // Generous top/bottom margins matching the finalized Stardew artworks (snowy pine forest borders + floating pill!)
    const padTop = Math.round(viewH * 0.095);
    const padBot = Math.round(viewH * 0.145);
    tileSize = Math.floor(Math.min((viewW - 14) / cols, (viewH - padTop - padBot) / rows));
    const gw = tileSize * cols, gh = tileSize * rows;
    gridOX = Math.floor((viewW - gw) / 2);
    gridOY = Math.floor(padTop + (viewH - padTop - padBot - gh) / 2);
    distStrideW = gw; // zero-gap edge-to-edge seamless horizontal city scroll!
  }

  // Doc 06 §5.2: True 4-Quadrant Quarter-Tile Autotile Resolver (maps 3 neighbors -> Tile 0..4!)
  const QUAD = { OUTER: 0, FULL: 1, EDGE_H: 2, EDGE_V: 3, INNER: 4 };
  function resolveQuad(hasH, hasV, hasDiag) {
    if (!hasH && !hasV) return QUAD.OUTER;
    if (hasH && !hasV)  return QUAD.EDGE_H;
    if (!hasH && hasV)  return QUAD.EDGE_V;
    return hasDiag ? QUAD.FULL : QUAD.INNER;
  }

  // Draw 1 continuous Stardew Autotile cell using baked 32x32 8-tile mother strip (auto_0..3)
  function drawAutotileCell(catIdx, x, y, ts, qNW, qNE, qSW, qSE, seed) {
    const strip = ART[`auto_${catIdx}`];
    if (!strip || !strip.complete || !strip.naturalWidth) {
      ctx.fillStyle = CATS[catIdx].fill;
      ctx.fillRect(x, y, ts, ts);
      return;
    }
    const T = 32, H = 16; // 32x32 source tile -> 16x16 per quadrant!
    const hw = Math.floor(ts / 2), hh = Math.floor(ts / 2);
    const hw2 = ts - hw, hh2 = ts - hh;

    // If all 4 quadrants are FULL (completely surrounded interior), sample lush Stardew Var A / Var B / Base tiles evenly!
    if (qNW === 1 && qNE === 1 && qSW === 1 && qSE === 1) {
      const m = seed % 3;
      const srcIdx = m === 0 ? 5 : (m === 1 ? 6 : 1);
      ctx.drawImage(strip, srcIdx * T, 0, T, T, x, y, ts, ts);
      return;
    }
    // Blit all 4 independent 16x16 sub-quadrants (NW, NE, SW, SE) from their resolved mother tiles!
    ctx.drawImage(strip, qNW * T,     0, H, H, x,      y,      hw,  hh);
    ctx.drawImage(strip, qNE * T + H, 0, H, H, x + hw, y,      hw2, hh);
    ctx.drawImage(strip, qSW * T,     H, H, H, x,      y + hh, hw,  hh2);
    ctx.drawImage(strip, qSE * T + H, H, H, H, x + hw, y + hh, hw2, hh2);

    // Lightly sprinkle subtle interior surface detail inside partly-connected tiles too!
    if ((seed % 2 === 0) && (qNW === 1 || qNE === 1 || qSW === 1 || qSE === 1)) {
      const varTile = (seed % 4 === 0) ? 5 : 6;
      ctx.save();
      ctx.globalAlpha = 0.78;
      ctx.drawImage(strip, varTile * T + 6, 6, 20, 20, x + Math.floor(ts * 0.18), y + Math.floor(ts * 0.18), Math.floor(ts * 0.64), Math.floor(ts * 0.64));
      ctx.restore();
    }
  }

  // Draw real extracted Stardew 16-bit building sprites (dark -> warm-lit!), with natural roof overflow!
  function drawStardewBuilding(st, b, ox, oy, ts) {
    const x = Math.round(ox + b.c * ts), y = Math.round(oy + b.r * ts);
    const w = b.w * ts, h = b.h * ts;
    const lit = b.lit;
    const distId = st.def.id;

    // Map building kind + district to exact extracted Stardew sprite keys (matching design 01/02/03/04!)
    let key = b.kind;
    let roofOver = 0; // how much the pitched roof/spire extends upward above row b.r!
    if (b.kind === 'clock') {
      key = lit ? 'clock_lit' : 'clock_dark';
      roofOver = Math.round(ts * (b.w >= 3 ? 1.15 : 0.62));
    } else if (b.kind === 'station') {
      key = lit ? 'station_lit' : 'station_dark';
      roofOver = Math.round(ts * 1.32);
    } else if (b.kind === 'ramen') {
      key = lit ? 'ramen_lit' : 'ramen_dark';
      roofOver = Math.round(ts * 0.12);
    } else if (b.kind === 'bakery') {
      key = lit ? 'bakery_lit' : 'bakery_dark';
      roofOver = Math.round(ts * 0.12);
    } else if (b.kind === 'cafe') {
      key = lit ? 'cafe_lit' : 'cafe_dark';
      roofOver = Math.round(ts * 0.12);
    } else if (b.kind === 'mart') {
      key = lit ? 'mart_lit' : 'mart_dark';
      roofOver = Math.round(ts * 0.12);
    } else if (b.kind === 'post') {
      if (distId === 2 && b.r === 0) { key = lit ? 'cottage_night_lit' : 'cottage_night'; roofOver = Math.round(ts * 0.92); }
      else if (distId === 3 && b.r === 8) { key = lit ? 'cottage_blue_lit' : 'cottage_blue'; roofOver = Math.round(ts * 0.45); }
      else { key = lit ? 'post_lit' : 'post_dark'; roofOver = Math.round(ts * 0.45); }
    } else if (b.kind === 'bath') {
      if (distId === 3 && b.r === 8) { key = lit ? 'bath_blue_lit' : 'bath_blue'; roofOver = Math.round(ts * 0.36); }
      else { key = lit ? 'bath_lit' : 'bath_dark'; roofOver = Math.round(ts * 0.42); }
    } else if (b.kind === 'park') {
      key = 'park'; roofOver = Math.round(ts * 0.25);
    } else if (b.kind === 'fountain') {
      key = 'fountain'; roofOver = 0;
    } else if (b.kind === 'shrine') {
      key = 'shrine'; roofOver = Math.round(ts * 0.08);
    }

    // Warm golden ambient lantern glow around lit Stardew shops!
    if (lit) {
      const grad = ctx.createRadialGradient(x + w/2, y + h*0.65, 2, x + w/2, y + h*0.65, Math.max(w, h) * 1.05);
      grad.addColorStop(0, 'rgba(255, 206, 92, 0.48)');
      grad.addColorStop(1, 'rgba(255, 206, 92, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(x - 14, y - 14, w + 28, h + 28);
    }

    // Soft warm-umber pixel contact shadow under building base
    ctx.fillStyle = 'rgba(32, 18, 12, 0.32)';
    ctx.fillRect(x + 2, y + h - 1, w - 2, 3);

    const img = ART[key];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, x - 1, y - roofOver, w + 2, h + roofOver + 1);
    } else {
      ctx.fillStyle = '#8f5d3c'; ctx.fillRect(x, y, w, h);
    }

    // Animated fountain water sparkle!
    if (b.kind === 'fountain') {
      const rip = Math.floor(animTime * 4) % 2;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(Math.round(x + w/2 - 1), Math.round(y + h*0.24 - rip*2), 2, 4);
      ctx.fillRect(Math.round(x + w/2 - 5 - rip), Math.round(y + h*0.48), 2, 1);
      ctx.fillRect(Math.round(x + w/2 + 4 + rip), Math.round(y + h*0.48), 2, 1);
    }
  }

  // Natural Stardew wall-base snow/mud/frost banking (Doc 06 §3.4 — clean integration with hand-drawn Stardew eaves!)
  function drawBuildingSnowIntegration(st, b, ox, oy, ts) {
    const rows = st.def.rows;
    const by = Math.round(oy + b.r * ts);
    const bh = b.h * ts;
    const isOpenCourtyard = (b.kind === 'park' || b.kind === 'fountain');

    // Soft sculpted snow/mud/frost drift banking gently up onto building south foundation wall!
    const sr = b.r + b.h;
    if (sr < rows) {
      for (let dc = 0; dc < b.w; dc++) {
        const c = b.c + dc;
        const cell = st.grid[sr][c];
        if (!cell || cell.type !== 'obs') continue;
        const catIdx = st.def.categories[cell.layers[0]];
        if (catIdx >= 4) continue; // independent boxes/branches don't smear onto walls
        const cat = CATS[catIdx];
        const cx = Math.round(ox + c * ts);
        const wallY = by + bh;
        const h1 = isOpenCourtyard ? 2 : (((c + b.r) % 2 === 0) ? 4 : 3);
        const h2 = isOpenCourtyard ? 2 : (((c + b.r) % 2 === 0) ? 3 : 4);
        ctx.fillStyle = cat.fill;
        ctx.fillRect(cx, wallY - h1, Math.floor(ts * 0.56), h1 + 2);
        ctx.fillRect(cx + Math.floor(ts * 0.44), wallY - h2, Math.ceil(ts * 0.56), h2 + 2);
        ctx.fillStyle = cat.hi;
        ctx.fillRect(cx + 1, wallY - h1 - 1, Math.floor(ts * 0.44), 2);
        ctx.fillRect(cx + Math.floor(ts * 0.5), wallY - h2 - 1, Math.floor(ts * 0.4), 2);
      }
    }
  }

  function drawDistrictChunk(st, offsetX, isActive) {
    const th = THEMES[themeIdx];
    const ts = tileSize, ox = Math.round(gridOX + offsetX), oy = gridOY;
    const rows = st.def.rows, cols = st.def.cols;
    const gw = cols * ts, gh = rows * ts;

    // 0. Railway track strip across the top of Station Market District (Lv.03!)
    if (st.def.id === 3 && artReady('rail_strip')) {
      const rh = Math.max(10, Math.round(ts * 0.52));
      ctx.drawImage(ART.rail_strip, ox - 6, oy - rh + 2, gw + 12, rh);
    }

    // Precompute lit lamp positions for warm cobblestone light pools
    const litLamps = [];
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (st.grid[r][c].lamp && st.grid[r][c].lampLit) litLamps.push([r, c]);

    // 1. Real Stardew Weathered Rounded Cobblestone Road Base (strictly inside [ox, ox + gw])
    if (artReady('cobble_patch')) {
      if (!cobblePattern) cobblePattern = ctx.createPattern(ART.cobble_patch, 'repeat');
      ctx.save();
      ctx.translate(ox, oy);
      ctx.fillStyle = cobblePattern;
      ctx.fillRect(0, 0, gw, gh);
      // Subtle atmospheric color grade for Dusk / Starlight themes!
      if (themeIdx === 1) { ctx.fillStyle = 'rgba(66, 44, 78, 0.24)'; ctx.fillRect(0, 0, gw, gh); }
      else if (themeIdx === 2) { ctx.fillStyle = 'rgba(18, 30, 68, 0.42)'; ctx.fillRect(0, 0, gw, gh); }
      ctx.restore();
    } else {
      ctx.fillStyle = th.roadBase;
      ctx.fillRect(ox, oy, gw, gh);
    }

    // Warm honey-gold lamp pools & fresh-clear flash pops on cleared cobblestone tiles
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = st.grid[r][c];
        const x = ox + c * ts, y = oy + r * ts;
        if (cell.type === 'empty') {
          let warm = 0;
          for (const [lr, lc] of litLamps) {
            const d = Math.hypot(lr - r, lc - c);
            if (d < 3.8) warm = Math.max(warm, 1 - d / 3.8);
          }
          if (warm > 0.02) {
            ctx.fillStyle = `rgba(255, 206, 94, ${(warm * 0.34).toFixed(3)})`;
            ctx.fillRect(x, y, ts, ts);
          }
          if (cell.revealPop > 0) {
            ctx.fillStyle = `rgba(255, 246, 185, ${(cell.revealPop * 0.55).toFixed(3)})`;
            ctx.fillRect(x + 1, y + 1, ts - 2, ts - 2);
          }
        }
      }
    }

    // 2. Underground brass steam pipes (Valve -> Ice Gates)
    for (const v of st.valves) {
      const vx = Math.round(ox + (v.c + 0.5) * ts), vy = Math.round(oy + (v.r + 0.5) * ts);
      for (const g of v.gates) {
        const gx = Math.round(ox + (g.c + 0.5) * ts), gy = Math.round(oy + (g.r + 0.5) * ts);
        ctx.strokeStyle = v.triggered ? '#fbbf24' : 'rgba(218, 108, 36, 0.42)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(gx, vy); ctx.lineTo(gx, gy); ctx.stroke();
      }
    }

    // 3. Draw Stardew 4-Quadrant Volumetric Autotiles (Snow/Ice/Frost/Mud) + Independent Branches/Boxes + Ice Gates!
    const pulse = 0.5 + 0.5 * Math.sin(animTime * 4.2);
    const getCell = (rr, cc) => (rr >= 0 && rr < rows && cc >= 0 && cc < cols) ? st.grid[rr][cc] : null;
    const isLink = (rr, cc, catIdx) => {
      const nb = getCell(rr, cc);
      if (!nb) return false;
      if (nb.type === 'bldg') return true; // Seamlessly bank flush into adjacent building walls!
      return nb.type === 'obs' && st.def.categories[nb.layers[0]] === catIdx;
    };
    const isOpenCell = (rr, cc) => {
      if (rr >= rows) return true;
      const nb = getCell(rr, cc);
      return !!(nb && nb.type === 'empty');
    };

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = st.grid[r][c];
        const x = ox + c * ts, y = oy + r * ts;

        if (cell.type === 'gate') {
          if (artReady('ice_gate')) {
            ctx.drawImage(ART.ice_gate, x + 1, y + 1, ts - 2, ts - 2);
          } else {
            ctx.fillStyle = '#38bdf8'; ctx.fillRect(x + 2, y + 2, ts - 4, ts - 4);
          }
          continue;
        }
        if (cell.valveId && cell.type === 'empty') {
          drawStardewValve(x + ts/2, y + ts/2, ts, true);
        }
        if (cell.type !== 'obs') continue;

        const catIdx = st.def.categories[cell.layers[0]];
        const topCat = CATS[catIdx];
        const isDouble = cell.layers.length >= 2;
        const botCatIdx = isDouble ? st.def.categories[cell.layers[1]] : -1;
        const botCat = isDouble ? CATS[botCatIdx] : null;
        const isHetero = isDouble && botCatIdx !== catIdx;
        const seed = ((r * 73 + c * 37 + st.def.id * 19) >>> 0);

        const drawObstacleBase = (kindIdx) => {
          if (kindIdx === 5) {
            // Real Stardew Festive Red Market Gift Box!
            const bk = `box_${seed % 4}`;
            if (artReady(bk)) ctx.drawImage(ART[bk], x + 1, y + 1, ts - 2, ts - 2);
            else { ctx.fillStyle = CATS[5].fill; ctx.fillRect(x + 2, y + 2, ts - 4, ts - 4); }
          } else if (kindIdx === 4) {
            // Real Stardew Snow-Dusted Evergreen Pine Branch Heap!
            const pk = `branch_${seed % 4}`;
            if (artReady(pk)) ctx.drawImage(ART[pk], x - 1, y - 1, ts + 2, ts + 2);
            else { ctx.fillStyle = CATS[4].fill; ctx.fillRect(x + 2, y + 2, ts - 4, ts - 4); }
          } else {
            // True 4-Quadrant Volumetric Stardew Autotile (Snow / Ice / Frost / Mud)!
            const n = isLink(r - 1, c, kindIdx), s = isLink(r + 1, c, kindIdx);
            const w = isLink(r, c - 1, kindIdx), e = isLink(r, c + 1, kindIdx);
            const nw = isLink(r - 1, c - 1, kindIdx), ne = isLink(r - 1, c + 1, kindIdx);
            const sw = isLink(r + 1, c - 1, kindIdx), se = isLink(r + 1, c + 1, kindIdx);
            drawAutotileCell(
              kindIdx, x, y, ts,
              resolveQuad(w, n, nw), resolveQuad(e, n, ne),
              resolveQuad(w, s, sw), resolveQuad(e, s, se),
              seed
            );
          }
        };

        if (isHetero) {
          // Doc 06 §3.3: Draw real bottom obstacle + universal wavy white snow cap draped over upper 62%!
          drawObstacleBase(botCatIdx);
          if (artReady('snow_cap')) {
            ctx.drawImage(ART.snow_cap, x, y - 1, ts, ts);
          }
        } else {
          drawObstacleBase(catIdx);
          // Same-color x2: overlay raised Stardew Tile 7 crown mound!
          if (isDouble && catIdx <= 3 && artReady(`auto_${catIdx}`)) {
            ctx.drawImage(ART[`auto_${catIdx}`], 7 * 32, 0, 32, 32, x, y - 3, ts, ts);
          } else if (isDouble && catIdx === 5 && artReady(`box_${(seed + 1) % 4}`)) {
            // Stacked twin festive boxes!
            ctx.drawImage(ART[`box_${(seed + 1) % 4}`], x + 3, y - 3, ts - 6, ts - 6);
          }
        }

        // Tiny crisp double-layer gem pip
        if (isDouble) {
          ctx.fillStyle = '#241712'; ctx.fillRect(x + ts - 7, y + 2, 5, 5);
          ctx.fillStyle = isHetero ? botCat.fill : '#fde047';
          ctx.fillRect(x + ts - 6, y + 3, 3, 3);
        }

        if (cell.valveId) drawStardewValve(x + ts/2, y + ts/2, ts, false);

        // Crisp warm golden edge shimmer ONLY on open-street-facing rim of reachable frontier tiles!
        // (Zero flat grey square mask over locked snow/ice/frost/mud so Stardew colors stay bright & rounded!)
        if (cell.reachable) {
          ctx.fillStyle = `rgba(255, 246, 178, ${(0.48 + pulse * 0.44).toFixed(2)})`;
          if (isOpenCell(r + 1, c)) ctx.fillRect(x + 2, y + ts - 2, ts - 4, 2);
          if (isOpenCell(r - 1, c)) ctx.fillRect(x + 2, y, ts - 4, 2);
          if (isOpenCell(r, c - 1)) ctx.fillRect(x, y + 2, 2, ts - 4);
          if (isOpenCell(r, c + 1)) ctx.fillRect(x + ts - 2, y + 2, 2, ts - 4);
        }
      }
    }

    // 4. Real Extracted Stardew Buildings (dark -> warm-lit!) + Wall-Base Snow Banking!
    for (const b of st.buildings) {
      drawStardewBuilding(st, b, ox, oy, ts);
      drawBuildingSnowIntegration(st, b, ox, oy, ts);
    }

    // 5. Micro-Pixel Strolling Townsfolk
    for (const res of st.residents) {
      const rx = Math.round(ox + (res.x + 0.5) * ts), ry = Math.round(oy + (res.y + 0.68) * ts);
      const bob = Math.round(Math.abs(Math.sin(res.phase)) * 1.5);
      ctx.fillStyle = '#2b160c'; ctx.fillRect(rx - 3, ry - 9 - bob, 6, 9);
      ctx.fillStyle = res.coat; ctx.fillRect(rx - 2, ry - 5 - bob, 4, 4);
      ctx.fillStyle = res.scarf; ctx.fillRect(rx - 2, ry - 6 - bob, 4, 2);
      ctx.fillStyle = '#fde2c4'; ctx.fillRect(rx - 2, ry - 9 - bob, 4, 3);
    }

    // 6. Doc 06 §5.3: 0.13s Directional Clip-Wipe Clearing Animations (shaved off in front of truck!)
    for (const wp of st.wipes) {
      const prog = Math.min(1, wp.t / wp.dur);
      const wx = ox + wp.c * ts, wy = oy + wp.r * ts;
      ctx.save();
      ctx.beginPath();
      if (wp.dir === 'up')         ctx.rect(wx, wy, ts, Math.max(0, Math.round(ts * (1 - prog))));
      else if (wp.dir === 'down')  ctx.rect(wx, wy + Math.round(ts * prog), ts, Math.max(0, Math.round(ts * (1 - prog))));
      else if (wp.dir === 'left')  ctx.rect(wx, wy, Math.max(0, Math.round(ts * (1 - prog))), ts);
      else                         ctx.rect(wx + Math.round(ts * prog), wy, Math.max(0, Math.round(ts * (1 - prog))), ts);
      ctx.clip();
      if (wp.catId <= 3 && artReady(`auto_${wp.catId}`)) {
        ctx.drawImage(ART[`auto_${wp.catId}`], 0, 0, 32, 32, wx, wy, ts, ts);
      } else if (wp.catId === 5 && artReady('box_0')) {
        ctx.drawImage(ART.box_0, wx + 1, wy + 1, ts - 2, ts - 2);
      } else if (wp.catId === 4 && artReady('branch_0')) {
        ctx.drawImage(ART.branch_0, wx - 1, wy - 1, ts + 2, ts + 2);
      }
      ctx.restore();
    }

    // 7. Dispatched 4-Direction Stardew Vehicles (ZERO cars on road until player taps a card!)
    const sorted = [...st.units].sort((a, b) => a.y - b.y);
    for (const u of sorted) {
      const ux = Math.round(ox + (u.x + 0.5) * ts), uy = Math.round(oy + (u.y + 0.5) * ts);
      ctx.save();
      // Warm directional golden headlight cone!
      const hl = ctx.createRadialGradient(ux, uy, 2, ux, uy, ts * 1.35);
      hl.addColorStop(0, u.isBeast ? 'rgba(255, 224, 108, 0.58)' : 'rgba(255, 238, 168, 0.42)');
      hl.addColorStop(1, 'rgba(255, 230, 140, 0)');
      ctx.fillStyle = hl; ctx.fillRect(ux - ts*1.4, uy - ts*1.4, ts*2.8, ts*2.8);

      const dw = Math.round(ts * (u.isBeast ? 1.48 : 1.24));
      if (u.dir === 'up' || u.dir === 'down') {
        const spr = createVertTruckCanvas(u.catId, u.dir, u.isBeast, u.isWildcard);
        ctx.drawImage(spr, Math.round(ux - dw*0.42), Math.round(uy - dw*0.48), Math.round(dw*0.84), Math.round(dw*0.96));
      } else {
        ctx.translate(ux, uy);
        if (u.dir === 'left') ctx.scale(-1, 1);
        if (u.isBeast && artReady('beast_truck')) {
          ctx.drawImage(ART.beast_truck, Math.round(-dw*0.6), Math.round(-dw*0.44), Math.round(dw*1.22), Math.round(dw*0.82));
        } else if (u.catId === 3 && !u.isWildcard && artReady('mud_truck')) {
          ctx.drawImage(ART.mud_truck, Math.round(-dw*0.56), Math.round(-dw*0.42), Math.round(dw*1.12), Math.round(dw*0.78));
        } else {
          const spr = createSideTruckCanvas(u.catId, u.isBeast, u.isWildcard);
          ctx.drawImage(spr, Math.round(-dw*0.52), Math.round(-dw*0.40), Math.round(dw*1.04), Math.round(dw*0.80));
        }
      }
      ctx.restore();
    }

    // 8. Vintage Stardew Cast-Iron Streetlamps with lush amber lantern glow
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = st.grid[r][c];
        if (!cell.lamp) continue;
        const lx = Math.round(ox + (c + 0.86) * ts), ly = Math.round(oy + (r + 0.86) * ts);
        const h = Math.round(ts * 0.82);
        if (cell.lampLit) {
          const g = ctx.createRadialGradient(lx, ly - h - 2, 1, lx, ly - h - 2, ts * 2.0);
          g.addColorStop(0, th.lampHalo); g.addColorStop(1, 'rgba(255,200,80,0)');
          ctx.fillStyle = g; ctx.fillRect(lx - ts*2.1, ly - h - ts*2.1, ts*4.2, ts*4.2);
        }
        // Flared cast-iron base + slim post + metallic glint
        ctx.fillStyle = '#2d2428';
        ctx.fillRect(lx - 2, ly - 2, 4, 2);
        ctx.fillRect(lx - 1, ly - h, 2, h);
        ctx.fillStyle = '#5c5258';
        ctx.fillRect(lx - 1, ly - h + 2, 1, h - 4);
        // Decorative lantern housing & peaked cap
        ctx.fillStyle = '#2d2428';
        ctx.fillRect(lx - 3, ly - h - 4, 6, 4);
        ctx.fillRect(lx - 2, ly - h - 5, 4, 1);
        ctx.fillStyle = cell.lampLit ? '#fef08a' : '#7a8da6';
        ctx.fillRect(lx - 2, ly - h - 3, 4, 2);
        if (cell.lampLit) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(lx - 1, ly - h - 3, 2, 1);
        }
      }
    }

    // 9. Aim Reticle & Fireballs
    if (isActive && st.aimMode && hoverTile) {
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = hoverTile.r + dr, nc = hoverTile.c + dc;
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
        ctx.fillStyle = 'rgba(239, 68, 68, 0.36)';
        ctx.fillRect(ox + nc * ts, oy + nr * ts, ts, ts);
        ctx.strokeStyle = '#fde047'; ctx.lineWidth = 1.5;
        ctx.strokeRect(ox + nc * ts + 0.5, oy + nr * ts + 0.5, ts - 1, ts - 1);
      }
    }
    for (const fb of st.fireballs) {
      ctx.fillStyle = '#f97316'; ctx.fillRect(fb.x - 5, fb.y - 5, 10, 10);
      ctx.fillStyle = '#fef08a'; ctx.fillRect(fb.x - 3, fb.y - 3, 6, 6);
    }

    // 10. Crisp Pixel Debris Particles & Float Labels
    for (const p of st.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x + offsetX), Math.round(p.y), p.sz, p.sz);
    }
    ctx.globalAlpha = 1;
    for (const f of st.floats) {
      ctx.globalAlpha = Math.min(1, f.life / (f.maxLife * 0.4));
      ctx.font = '900 11px sans-serif'; ctx.textAlign = 'center';
      ctx.strokeStyle = '#24140c'; ctx.lineWidth = 3;
      ctx.strokeText(f.text, f.x + offsetX, f.y);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x + offsetX, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawStardewValve(cx, cy, ts, open) {
    const s = Math.round(ts * 1.08);
    if (artReady('valve_red')) {
      ctx.save();
      if (open) ctx.filter = 'brightness(1.3) saturate(1.2) drop-shadow(0 0 4px #fde047)';
      ctx.drawImage(ART.valve_red, Math.round(cx - s/2), Math.round(cy - s/2), s, s);
      ctx.restore();
    } else {
      ctx.fillStyle = open ? '#fbbf24' : '#dc2626';
      ctx.fillRect(Math.round(cx - 6), Math.round(cy - 6), 12, 12);
    }
  }

  function render() {
    ctx.clearRect(0, 0, viewW, viewH);
    const st = curState(); if (!st) return;
    const th = THEMES[themeIdx];
    const rows = st.def.rows, cols = st.def.cols;
    const ts = tileSize, gw = cols * ts, gh = rows * ts;

    ctx.save();
    if (st.trauma > 0) {
      const s = st.trauma * st.trauma * 6;
      ctx.translate(Math.round(Math.sin(st.shakeT*1.7)*s), Math.round(Math.sin(st.shakeT*2.3)*s));
    }

    // 0. Unified continuous Stardew sky + snowy pine borders (matching design 01/03/04!)
    ctx.fillStyle = th.snowBg;
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.fillStyle = th.sky;
    ctx.fillRect(0, 0, viewW, Math.max(8, gridOY));

    // Top real Stardew snowy evergreen pine canopy strip (or crescent moon night sky!)
    const topKey = `pines_top_${th.id}`;
    if (artReady(topKey)) {
      const stripH = Math.max(24, gridOY + 2);
      ctx.drawImage(ART[topKey], 0, 0, viewW, stripH);
    }

    // Side street continuation past scroll boundaries
    const firstLeft = Math.round(gridOX - camX * distStrideW);
    const lastRight = Math.round(gridOX + (districtStates.length - camX) * distStrideW);
    const drawSideStreet = (sx, sw) => {
      if (sw <= 0) return;
      ctx.fillStyle = th.roadAlt;
      ctx.fillRect(sx, gridOY, sw, gh);
      ctx.fillStyle = 'rgba(235, 244, 255, 0.25)';
      ctx.fillRect(sx, gridOY + 2, sw, gh - 4);
    };
    if (firstLeft > 0) drawSideStreet(0, firstLeft);
    if (lastRight < viewW) drawSideStreet(lastRight, viewW - lastRight);

    // Continuous unbroken south cobblestone boulevard + gliding white lane dashes
    const blvdY = gridOY + gh;
    const blvdH = 14;
    ctx.fillStyle = th.curb;
    ctx.fillRect(0, blvdY, viewW, blvdH);
    ctx.fillStyle = 'rgba(255, 252, 240, 0.22)';
    ctx.fillRect(0, blvdY, viewW, 1);
    ctx.fillStyle = 'rgba(255, 244, 210, 0.72)';
    const dashStep = 14;
    const dashOff = ((-Math.round(camX * distStrideW) % dashStep) + dashStep) % dashStep;
    for (let dx = dashOff - dashStep; dx < viewW; dx += dashStep) {
      ctx.fillRect(dx, blvdY + 6, 7, 2);
    }

    // Bottom real Stardew snowy evergreen pine border strip right behind the floating counter pill!
    const botKey = `pines_bot_${th.id}`;
    if (artReady(botKey)) {
      const botY = blvdY + blvdH;
      const botH = Math.max(24, viewH - botY);
      ctx.drawImage(ART[botKey], 0, botY, viewW, botH);
    }

    // 1. Chunked Horizontal Viewport Culling (edge-to-edge zero-gap city blocks!)
    for (let i = 0; i < districtStates.length; i++) {
      const offsetX = (i - camX) * distStrideW;
      if (offsetX + distStrideW < -viewW * 0.25 || offsetX > viewW * 1.25) continue;
      drawDistrictChunk(districtStates[i], offsetX, i === activeIdx);
    }

    // 2. Natural stone-curb & mini crosswalk transition seam between adjacent districts
    for (let i = 0; i < districtStates.length - 1; i++) {
      const seamX = Math.round(gridOX + (i + 1 - camX) * distStrideW);
      if (seamX < -16 || seamX > viewW + 16) continue;
      ctx.fillStyle = 'rgba(30, 41, 59, 0.22)';
      ctx.fillRect(seamX - 1, gridOY, 2, gh);
      ctx.fillStyle = 'rgba(255, 248, 224, 0.75)';
      for (let sy = blvdY + 2; sy < blvdY + blvdH - 1; sy += 3) {
        ctx.fillRect(seamX - 4, sy, 8, 2);
      }
    }

    // 3. Crisp 1-2px ambient pixel snow
    ctx.fillStyle = th.snowFlake;
    for (const f of flakes) ctx.fillRect(Math.round(f.x * viewW), Math.round(f.y * viewH), f.r, f.r);

    // 4. Golden warm sprint frame glow
    if (st.sprintActive && st.status === 'playing') {
      ctx.strokeStyle = `rgba(253, 224, 71, ${0.4 + 0.3 * Math.sin(animTime * 6)})`;
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, viewW - 4, viewH - 4);
    }
    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* =========================================================
     13. INPUT & EVENT WIRING (Scroll strictly locked during play)
  ========================================================= */
  function evtToTile(ev) {
    const rect = canvas.getBoundingClientRect();
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
    const c = Math.floor((cx - rect.left - gridOX) / tileSize);
    const r = Math.floor((cy - rect.top - gridOY) / tileSize);
    const st = curState();
    if (r >= 0 && r < st.def.rows && c >= 0 && c < st.def.cols) return { r, c };
    return null;
  }

  canvas.addEventListener('pointerdown', ev => {
    if (curState().aimMode) {
      const t = evtToTile(ev);
      if (t) dropFlame(t.r, t.c); else toggleAim(false);
    }
  });
  canvas.addEventListener('pointermove', ev => {
    hoverTile = curState().aimMode ? evtToTile(ev) : null;
  });
  canvas.addEventListener('pointerleave', () => { hoverTile = null; });

  document.getElementById('btn-theme').addEventListener('click', () => {
    themeIdx = (themeIdx + 1) % THEMES.length;
    const shell = document.getElementById('app-shell');
    shell.className = THEMES[themeIdx].css;
    document.getElementById('btn-theme').textContent = THEMES[themeIdx].label;
  });
  document.getElementById('btn-sound').addEventListener('click', () => {
    sfx.muted = !sfx.muted; document.getElementById('btn-sound').textContent = sfx.muted ? '🔇' : '🔊';
  });
  document.getElementById('btn-restart').addEventListener('click', restartCurrentDistrict);
  document.getElementById('aim-cancel').addEventListener('click', () => toggleAim(false));
  document.getElementById('sprint-btn').addEventListener('click', () => {
    const st = curState(); st.autoSweeping = true; st.autoCd = 0;
    document.getElementById('sprint-btn').classList.remove('show');
  });

  document.getElementById('prop-wildcard').addEventListener('click', useWildcard);
  document.getElementById('prop-expand').addEventListener('click', useExpand);
  document.getElementById('prop-shuffle').addEventListener('click', useShuffle);
  document.getElementById('prop-flame').addEventListener('click', () => toggleAim());

  document.getElementById('res-ex').addEventListener('click', useExpand);
  document.getElementById('res-wc').addEventListener('click', useWildcard);
  document.getElementById('res-fl').addEventListener('click', () => toggleAim(true));
  document.getElementById('res-sh').addEventListener('click', useShuffle);
  document.getElementById('res-re').addEventListener('click', restartCurrentDistrict);

  document.getElementById('win-re').addEventListener('click', restartCurrentDistrict);
  document.getElementById('win-next').addEventListener('click', () => selectDistrict((activeIdx + 1) % DISTRICTS.length, false));

  window.addEventListener('resize', resizeCanvas);

  initAllDistricts();
  resizeCanvas();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
